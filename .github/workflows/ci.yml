name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Swift tests
        run: swift test

      - name: Dashboard and packaging contract tests
        run: |
          for test_file in Tests/*.js; do
            node "$test_file" || exit 1
          done

      - name: Release build
        run: swift build -c release
